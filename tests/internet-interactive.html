<!doctype html><html lang="th"><meta charset="utf-8"><title>Internet UI audit</title><link rel="stylesheet" href="../dist/assets/style.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><h1>Internet UI audit · local only</h1><button id="run">Run Internet tests</button><pre id="report"></pre><div id="area" style="max-width:900px"></div><script type="module">
import {internetSurface,initInternet} from '../dist/assets/internet-lab.js';import {buildInternet} from '../dist/assets/internet-model.js';import {mountScene} from '../dist/assets/network-mechanism-scene.js';
const area=document.querySelector('#area'),report=document.querySelector('#report'),sleep=ms=>new Promise(r=>setTimeout(r,ms));const tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;area.innerHTML=internetSurface();let scene,completed=false,count=0;const c=initInternet({id:'internet',title:'Internet'},async(el,opts)=>{scene=mountScene(el,opts);return scene;},()=>completed=true);await tick();
try{for(const service of ['social','cdn','game'])for(const route of ['peering','transit'])for(const fault of ['none','gateway','dns','uplink']){
 for(const [name,value]of Object.entries({service,route,fault})){const el=area.querySelector(`[name=${name}]`);el.value=value;el.dispatchEvent(new Event('change'));}const m=buildInternet({service,route,fault});const range=area.querySelector('input[type=range]');
 for(let i=0;i<m.steps.length;i++){if(i)area.querySelector('[data-internet=next]').click();await tick();if(area.querySelector('.internet-evidence h3').textContent!==m.steps[i].title)throw Error('wrong evidence');if(scene.snapshot().step!==i)throw Error('wrong renderer step');if(scene.snapshot().transfers.length!==m.steps[i].transfers.length)throw Error('wrong transfers');}
 area.querySelector('[data-internet=play]').click();await sleep(1500);if(range.value!=='1')throw Error('play/replay failed');if(area.querySelector('[data-internet=play]').textContent.includes('หยุด'))area.querySelector('[data-internet=play]').click();area.querySelector('[data-internet=reset]').click();if(range.value!=='0')throw Error('reset failed');count++;report.textContent=`PASS ${count}/24 service/route/fault UI cases\n`;}
 if(!completed)throw Error('successful observation not recorded');report.textContent+='ALL PASS: 24 Internet UI cases, every step/transfer, autoplay/replay/reset and completion gating';
}catch(e){report.textContent+='FAIL '+e.stack;}finally{c.dispose();scene.dispose();document.querySelector('#run').disabled=false;}};
</script></html>
