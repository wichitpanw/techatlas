<!doctype html><html><meta charset="utf-8"><title>Network responsive audit</title><h1>390px embedded viewport · local only</h1><pre id="report"></pre><iframe id="app" style="width:390px;height:844px;border:0"></iframe><script type="module">
const frame=document.querySelector('#app'),report=document.querySelector('#report'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
for(const id of ['internet','tcp-handshake']){await new Promise(r=>{frame.onload=r;frame.src='../dist/?responsive='+id+'#lesson/'+id;});const d=frame.contentDocument;for(let i=0;i<200&&!d.querySelector('canvas');i++)await sleep(40);const width=d.documentElement.clientWidth,scroll=d.documentElement.scrollWidth;if(!d.querySelector('canvas')||scroll>width){report.textContent+='FAIL '+id+' '+width+'/'+scroll;break;}const reportButton=d.querySelector('[data-report=lesson]');reportButton.click();if(!d.querySelector('.feedback-dialog').open){report.textContent+='FAIL dialog';break;}d.querySelector('.feedback-dialog .close').click();report.textContent+=id+' PASS '+width+'px, no horizontal overflow, report opens\n';}
</script></html>
