<!doctype html><meta charset="utf-8"><title>New provider lab checks</title><link rel="stylesheet" href="../dist/assets/style.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script><button id="run">ตรวจเฉพาะหกบทใหม่</button><pre id="report"></pre><div class="workarea" id="area"></div><script type="module">
import {telecomLessons,buildTelecom} from '../dist/assets/telecom-labs.js';
import {conceptSurface,initConcept} from '../dist/assets/network-concepts.js';
import {initMechanism} from '../dist/assets/network-mechanism.js';
import {mountScene} from '../dist/assets/network-mechanism-scene.js';
const area=document.querySelector('#area'),report=document.querySelector('#report');
document.querySelector('#run').onclick=async()=>{report.textContent='Running new lessons only';try{for(const l of telecomLessons){area.innerHTML=conceptSurface(l);let complete=0;initConcept(l,()=>complete++);let scene;const controller=initMechanism(l,async(el,options)=>scene=mountScene(el,options));await new Promise(r=>setTimeout(r,150));
for(let i=0;i<3;i++){area.querySelector(`[data-state="${i}"]`).click();const m=buildTelecom(l,i);for(let s=0;s<m.steps.length;s++){area.querySelector(`[data-mechanism-step="${s}"]`).click();if(area.querySelector('.mechanism-evidence h3').textContent!==m.steps[s].title)throw Error(l.id+' wrong evidence');if(area.querySelectorAll('.mechanism-flight').length!==m.steps[s].transfers.length)throw Error(l.id+' wrong transfers');}area.querySelector('[data-mechanism-action=reset]').click();area.querySelector('[data-mechanism-action=play]').click();await new Promise(r=>setTimeout(r,1500));if(area.querySelector('.mechanism-controls input').value!=='1')throw Error(l.id+' playback');area.querySelector('[data-mechanism-action=play]').click();}
area.querySelector(`[data-answer="${l.answer}"]`).click();if(!complete)throw Error(l.id+' completion');controller.dispose();scene.dispose();report.textContent+='\n'+l.id+' PASS';}report.textContent+='\nALL PASS: 6 new 3D lessons / 18 scenarios / playback / completion';}catch(e){report.textContent+='\nFAIL '+e.stack;}};
</script>
