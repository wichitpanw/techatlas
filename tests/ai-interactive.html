<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Lab verification</title><link rel="stylesheet" href="../dist/assets/style.css"><h1>AI Lab verification · local only</h1><button id="run">Run AI checks</button><pre id="report"></pre><main></main><script type="module">
import {aiLessons,aiSections} from '../dist/assets/ai-curriculum.js';import {aiSurface,initAI} from '../dist/assets/ai-lab.js';
const main=document.querySelector('main'),report=document.querySelector('#report');const check=(v,message)=>{if(!v)throw Error(message);};
document.querySelector('#run').onclick=()=>{report.textContent='';try{check(aiSections[0].id==='ai-basics','section shape');for(const l of aiLessons){main.innerHTML=aiSurface(l);let completed=0;initAI(l,()=>completed++);const q=s=>main.querySelector(s),click=s=>q(s).click();click(`[data-ai-answer="${l.answer}"]`);check(!completed,'must experiment before completion');
if(l.id==='ai-map'){q('#ai-example').value='image';q('#ai-example').dispatchEvent(new Event('change'));check(q('#ai-map-detail').textContent.includes('GenAI'),'image classification');}
else if(l.id==='ai-tokens'){click('#ai-train');check(q('#ai-distribution').textContent.includes('75.0%'),'start distribution');click('#ai-next');check(q('#ai-generated').textContent==='ฉัน','seeded generation');q('#ai-corpus').value='';click('#ai-train');check(q('#ai-status').textContent.includes('อย่างน้อย'),'empty input');}
else{click('#ai-train');check(q('#ai-prediction').textContent.includes(l.id==='ai-rules'?'65 ≥ 60':'65 ≥ 70'),'threshold');if(l.id==='ai-training'){click('#ai-add');check(q('#ai-prediction').textContent.includes('65 ≥ 70'),'frozen inference');click('#ai-train');check(q('#ai-prediction').textContent.includes('65 ≥ 47.5'),'retraining');}}
click(`[data-ai-answer="${l.answer}"]`);check(completed===1,'completion');click('#ai-reset');check(q('#feedback').textContent==='','reset feedback');report.textContent+=l.id+' PASS\n';}main.replaceChildren();report.textContent+='ALL PASS: four AI interactive labs';}catch(e){report.textContent+='FAIL: '+e.stack;}};
</script></html>
