<!doctype html><meta charset="utf-8"><title>New service and repair UI</title><link rel="stylesheet" href="../dist/assets/style.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script><button id="run">ตรวจ Lab ใหม่</button><pre id="report"></pre><section class="workarea" id="area"></section><script type="module">
import {serviceLessons,serviceSurface,initService} from '../dist/assets/service-tools.js';
import {repairSurface,initRepair} from '../dist/assets/repair-lab.js';
const area=document.querySelector('#area'),report=document.querySelector('#report');
const check=(value,message)=>{if(!value)throw Error(message);};
document.querySelector('#run').onclick=async()=>{try{report.textContent='Running';for(const l of serviceLessons){area.innerHTML=serviceSurface(l);let passed=0;const c=initService(l,()=>passed++);await new Promise(r=>setTimeout(r,500));area.querySelector('[data-service-answer="0"]').click();check(!passed,'premature completion');area.querySelector('[data-service-play]').click();await new Promise(r=>setTimeout(r,900));check(area.querySelector('[data-service-step]').value==='1','playback');area.querySelector('[data-service-play]').click();for(let config=0;config<2;config++){if(config){area.querySelector('select').selectedIndex=1;area.querySelector('form').requestSubmit();}const range=area.querySelector('[data-service-step]');range.value=11;range.dispatchEvent(new Event('input'));}area.querySelector('[data-service-answer="0"]').click();check(passed===1,'completion gate');check(area.querySelector('canvas'),'3D canvas');area.querySelector('[data-service-reset]').click();check(area.querySelector('[data-service-step]').value==='0','reset');c.dispose();report.textContent+='\n'+l.id+' PASS';}
area.innerHTML=repairSurface();let passed=0;const c=initRepair({id:'noc-incident'},()=>passed++);await new Promise(r=>setTimeout(r,500));for(const [fault,probe]of [['vlan','vlan'],['route','route'],['uplink','link']]){const select=area.querySelector('[data-repair-case]');select.value=fault;select.dispatchEvent(new Event('change'));area.querySelector(`[data-fix="${fault}"]`).click();check(area.querySelector('[data-repair-status]').textContent.includes('ก่อนแก้'),'baseline gate');area.querySelector('[data-repair-test]').click();check(area.querySelector('[data-repair-status]').textContent.includes('No reply'),'failed service');area.querySelector(`[data-probe="${probe}"]`).click();check(area.querySelector('[data-repair-cli]').textContent,'evidence');check(!area.querySelectorAll('.mechanism-flight').length,'read-only evidence traffic');area.querySelector(`[data-fix="${fault}"]`).click();area.querySelector('[data-repair-test]').click();check(area.querySelector('[data-repair-status]').textContent.includes('Reply'),'recovery');area.querySelector('[data-rollback]').click();area.querySelector('[data-repair-test]').click();check(area.querySelector('[data-repair-status]').textContent.includes('No reply'),'rollback');}check(passed>0,'NOC completion');check(area.querySelector('canvas'),'repair 3D');c.dispose();report.textContent+='\nrepair/NOC PASS\nALL PASS';}catch(e){report.textContent+='\nFAIL '+e.stack;}};
</script>
